    // Helper: Dynamic Real-time Relative Timestamp Formatter
    function getRelativeTimeInfo(timestamp) {
      if (!timestamp) return { text: '방금 전', isRecent: true };
      const diffSec = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
      if (diffSec < 60) return { text: '방금 전', isRecent: true };
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 10) return { text: `${diffMin}분 전`, isRecent: true };
      if (diffMin < 60) return { text: `${diffMin}분 전`, isRecent: false };
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return { text: `${diffHour}시간 전`, isRecent: false };
      return { text: `${Math.floor(diffHour / 24)}일 전`, isRecent: false };
    }

      const handleScroll = (e) => {
        const currentScrollTop = e?.target ? e.target.scrollTop : window.scrollY;
        
        if (currentScrollTop <= 10) {
          setIsNavVisible(true);
          lastScrollTopRef.current = currentScrollTop;
          return;
        }

        const diff = currentScrollTop - lastScrollTopRef.current;
        if (diff > 8) {
          setIsNavVisible(false);
        } else if (diff < -8) {
          setIsNavVisible(true);
        }
        lastScrollTopRef.current = currentScrollTop;
      };

      const handleTabChange = (tabId) => {
        setActiveTab(tabId);
        setIsNavVisible(true);
        if (mainRef.current) {
          mainRef.current.scrollTop = 0;
        }
        window.scrollTo(0, 0);
      };

      useEffect(() => {
        setIsNavVisible(true);
        if (mainRef.current) {
          mainRef.current.scrollTop = 0;
        }
        window.scrollTo(0, 0);
      }, [activeTab]);

      useEffect(() => {
        const onWinScroll = () => {
          const currentScrollTop = window.scrollY;
          if (currentScrollTop <= 10) {
            setIsNavVisible(true);
            lastScrollTopRef.current = currentScrollTop;
            return;
          }
          const diff = currentScrollTop - lastScrollTopRef.current;
          if (diff > 8) {
            setIsNavVisible(false);
          } else if (diff < -8) {
            setIsNavVisible(true);
          }
          lastScrollTopRef.current = currentScrollTop;
        };

        window.addEventListener('scroll', onWinScroll);
        return () => window.removeEventListener('scroll', onWinScroll);
      }, []);

        return saved ? JSON.parse(saved) : defaultRaidData;
      });

      });

      }, []);

      // Add Post

                        }`}
                        title="새 교환 카테고리 태그 직접 추가"
                      >
                        <span>+</span>
                      </button>
                    </div>

                    {isAddingSwapTag && (
                      <div className="mt-2 flex space-x-1.5 animate-fadeIn">
                        <input
                          type="text"
                          placeholder="새 카테고리 태그명 (예: 캔뱃지, 코스프레)"
                          value={customSwapInput}
                          onChange={(e) => setCustomSwapInput(e.target.value)}
                          className={`flex-1 border rounded-lg px-2.5 py-1.5 text-xs ${
                            isBaepsae ? 'bg-stone-50 border-pink-300 text-stone-800' : 'bg-slate-800 border-indigo-500 text-white'
                          }`}
                        />
                        <button
                          type="button"
                          onClick={handleAddCustomSwapTag}
                          className="px-3 py-1.5 bg-pink-500 text-white rounded-lg text-xs font-bold"
                        >
                          추가
                        </button>
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="text-xs font-bold block mb-1">양도 항목</label>
                    <input name="have" required placeholder="예: A-04 부스 홀로그램 엽서" className={`w-full border rounded-lg p-2.5 text-xs ${
                      isBaepsae ? 'bg-stone-50 border-stone-300 text-stone-800' : 'bg-slate-800 border-slate-700 text-white'
                    }`} />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-pink-600 block mb-1">구함 항목</label>
                    <input name="want" required placeholder="예: B-02 작가님 아크릴 스탠드" className={`w-full border rounded-lg p-2.5 text-xs ${
                      isBaepsae ? 'bg-stone-50 border-stone-300 text-stone-800' : 'bg-slate-800 border-slate-700 text-white'
                    }`} />
                  </div>
                  <div>
                    <label className="text-xs font-bold block mb-1">접선 장소</label>
                    <input name="loc" required placeholder="예: 1층 카페테리아 입구" className={`w-full border rounded-lg p-2.5 text-xs ${
                      isBaepsae ? 'bg-stone-50 border-stone-300 text-stone-800' : 'bg-slate-800 border-slate-700 text-white'
                    }`} />
                  </div>
                  <div className="flex items-center space-x-2 text-xs font-bold text-pink-600">
                    <input type="checkbox" name="boosted" id="b" />
                    <label htmlFor="b">📢 100원 확성기로 상단 노출</label>
                  </div>
                  <button type="submit" className="w-full py-3 bg-pink-500 hover:bg-pink-600 text-white rounded-xl font-bold text-xs shadow-md">
                    등록하기 (관리자 등록)
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Share Swap Card Modal */}
          {shareSwapCard && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
              <div className={`border w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 ${
                isBaepsae ? 'bg-white border-amber-200 text-stone-800' : 'bg-slate-900 border-slate-700 text-slate-100'
              }`}>
                <div className="flex justify-between items-center border-b border-stone-200 dark:border-slate-800 pb-2">
                  <h3 className="text-sm font-bold">📢 공유 카드</h3>
                  <button onClick={() => setShareSwapCard(null)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <div className={`p-4 rounded-xl border space-y-2 ${
                  isBaepsae ? 'bg-pink-50 border-pink-200' : 'bg-gradient-to-br from-indigo-950 to-slate-900 border-indigo-500/30'
                }`}>
                  <p className="text-xs font-bold text-pink-600">Ota-Cu Blind Swap Card</p>
                  <p className="text-xs"><b>양도:</b> {shareSwapCard.have}</p>
                  <p className="text-xs text-pink-600 font-bold"><b>구함:</b> {shareSwapCard.want}</p>
                  <p className="text-[10px] opacity-75">📍 {shareSwapCard.loc}</p>
                </div>

                <button 
                  onClick={() => {
                    const text = `[Ota-Cu 스왑] 🔄 ${shareSwapCard.have} 교환 원합니다!\n구함: ${shareSwapCard.want}\n📍 접선: ${shareSwapCard.loc}\n#일러스트코리아 #OtaCu #굿즈교환`;
                    navigator.clipboard.writeText(text);
                    showToast('공유 텍스트가 클립보드에 복사되었습니다!');
                  }}
                  className="w-full py-2.5 bg-pink-500 text-white rounded-xl text-xs font-bold"
                >
                  트위터 공유용 텍스트 복사
                </button>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-pink-400 text-pink-200 px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold animate-bounce">
              {toastMsg}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

    // Helper: Dynamic Real-time Relative Timestamp Formatter
    function getRelativeTimeInfo(timestamp) {
      if (!timestamp) return { text: '방금 전', isRecent: true };
      const diffSec = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
      if (diffSec < 60) return { text: '방금 전', isRecent: true };
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 10) return { text: `${diffMin}분 전`, isRecent: true };
      if (diffMin < 60) return { text: `${diffMin}분 전`, isRecent: false };
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return { text: `${diffHour}시간 전`, isRecent: false };
      return { text: `${Math.floor(diffHour / 24)}일 전`, isRecent: false };
    }

    // Helper: Normalize booth codes to standard "A-000" format (e.g. f110 -> F-110, f 110 -> F-110)
    function normalizeBoothCode(str) {
      if (!str) return '';
      const trimmed = str.trim().toUpperCase();
      const m = trimmed.match(/^([A-Z]{1,2})[\s\-]*(\d{1,4})$/);
      if (m) {
        return `${m[1]}-${m[2]}`;
      }
      return trimmed;
    }

        const item = pdfSilko26[k];
        const itemBoothClean = item.booth.replace(/[\s\-]/g, '').toUpperCase();
        
        // Match booth code without hyphen/spaces (e.g. F110 == F110, D106 == D106)
        if (itemBoothClean === queryClean || item.booth.toUpperCase() === queryUpper) {
          return item;
        }

        // Match booth name or author name
        if (item.name && (item.name.toLowerCase().includes(trimmed.toLowerCase()) || trimmed.toLowerCase().includes(item.name.toLowerCase()))) {
          return item;
        }
      }
      return null;
    }

    // Helper: A* Pathfinding Engine
    function findShortestPath(grid, start, end) {
      const rows = grid.length;
      const cols = grid[0].length;
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      const queue = [{ x: start.x, y: start.y, path: [{ x: start.x, y: start.y }] }];
      const visited = new Set();
      visited.add(`${start.x},${start.y}`);

      while (queue.length > 0) {
        const { x, y, path } = queue.shift();
        if (x === end.x && y === end.y) return path;

        for (const [dx, dy] of dirs) {
          const nx = x + dx;
          const ny = y + dy;
          if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
            if ((grid[ny][nx] !== 1 || (nx === end.x && ny === end.y)) && !visited.has(`${nx},${ny}`)) {
              visited.add(`${nx},${ny}`);
              queue.push({ x: nx, y: ny, path: [...path, { x: nx, y: ny }] });
            }
          }
        }
      }
      return [start, end];
    }

    // Helper: TSP Nearest Neighbor Route Ordering
    function calculateOptimalOrder(startPoint, targets) {
      if (!targets || targets.length === 0) return [];
      const remaining = [...targets];
      const ordered = [];
      let current = startPoint;

      while (remaining.length > 0) {
        let bestIdx = 0;
        let minDist = Infinity;
        for (let i = 0; i < remaining.length; i++) {
          const dist = Math.abs(current.x - remaining[i].x) + Math.abs(current.y - remaining[i].y);
          if (dist < minDist) {
            minDist = dist;
            bestIdx = i;
          }
        }
        const nextTarget = remaining.splice(bestIdx, 1)[0];
        ordered.push(nextTarget);
        current = nextTarget;
      }
      return ordered;
    }

          const newX = e.touches[0].clientX - touchStartRef.current.startX;
          const newY = e.touches[0].clientY - touchStartRef.current.startY;
          setPanOffset({ x: newX, y: newY });
        } else if (touchStartRef.current.type === 'pinch' && e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const ratio = dist / touchStartRef.current.startDist;
          const newScale = Math.min(3.5, Math.max(1.0, touchStartRef.current.startZoom * ratio));
          setZoomScale(newScale);

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = scanImageSrc;
            await new Promise((res) => { img.onload = res; });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 400;
            canvas.height = 250;

            // White Background & Render zoomed/panned viewport image
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 400, 250);
            ctx.translate(200 + panOffset.x, 125 + panOffset.y);
            ctx.scale(zoomScale, zoomScale);
            ctx.drawImage(img, -img.width / 2, -img.height / 2);

            // Canvas Binarization & High Contrast Grayscale Thresholding
            const imgData = ctx.getImageData(0, 0, 400, 250);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
              const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
              const v = avg < 140 ? 0 : 255;
              data[i] = v;
              data[i + 1] = v;
              data[i + 2] = v;
            }
            ctx.putImageData(imgData, 0, 0);

            // Run Tesseract OCR on preprocessed canvas
            const worker = await Tesseract.createWorker('eng+kor');
            const ret = await worker.recognize(canvas);
            await worker.terminate();

            const text = (ret.data.text || '').replace(/\s+/g, ' ');
            console.log('Tesseract Binarized OCR Text Output:', text);

            // Match Booth Code Pattern (e.g. F-110, F110, f 110, T-110, F-206)
            const match = text.match(/([A-Z]{1,2}[\s\-]*\d{1,4})/i);

            if (match) {
              const code = normalizeBoothCode(match[1]);
              matchedObj = searchBoothDict(code) || { booth: code, name: '현장 스캔 부스' };

                        }
                        handleAddCustomStartLocation(ocrForm.booth, ocrForm.name);
                        setIsOcrModalOpen(false);
                      }}
                      className="py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md flex items-center justify-center space-x-1"
                    >
                      <span>🚩</span>
                      <span>출발위치에 추가</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-pink-400 text-pink-200 px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold animate-bounce">
              {toastMsg}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
